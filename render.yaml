# render.yaml
services:
  - type: web
    name: pdf-qa-app
    env: python
    buildCommand: pip install -r requirements.txt
    # Update the start command to explicitly bind to PORT
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.12
      - key: PORT
        fromService:
          type: web
          name: pdf-qa-app
          property: port
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
    autoDeploy: true
    healthCheckPath: /
    disk:
      name: tmp
      mountPath: /tmp
      sizeGB: 1
    dependencies:
      - type: system
        name: tesseract-ocr
      - type: system
        name: tesseract-ocr-eng
    buildFilter:
      paths:
        - requirements.txt
        - "**/*.py"
        - templates/**
    scaling:
      minInstances: 1
      maxInstances: 1
      targetMemoryPercent: 80